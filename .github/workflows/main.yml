name: Elyzareth OS — Continuous Verification

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Structure & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Elyzareth OS Repository
        uses: actions/checkout@v4

      - name: Verify Frozen Structural Hierarchy
        run: |
          echo "Verifying top-level structural branches..."
          for dir in foundation kernel command-center creative creative/creative-factory corpus production visual-direction forensic governance evidence assets release integrations security backup background analytics shared design-system navigation testing documentation migration tools app core; do
            if [ ! -d "$dir" ]; then
              echo "MISSING REQUIRED BRANCH: $dir"
              exit 1
            fi
          done
          echo "All approved top-level branches verified."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Unit & Robolectric Verification Suite
        run: gradle :app:testDebugUnitTest --stacktrace
